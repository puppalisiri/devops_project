
services:
  app:
    build: .
    container_name: telangana-tourism-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: tourism_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: telangana_tourism
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tourism_uploads:/app/public/uploads
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: telangana-tourism-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: telangana_tourism
      MYSQL_USER: tourism_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  tourism_uploads:
